# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
<%
  require_relative "../lib/ugo/database_pool"
%>
default: &default
  adapter: sqlite3
  pool: <%= Ugo::DatabasePool.size %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/queue.sqlite3
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# UI tour environment: an isolated SQLite file driven by bin/ui-tour. The
# runner wipes and reseeds it on every run so screenshots are deterministic.
tour:
  primary:
    <<: *default
    database: storage/tour.sqlite3
  cache:
    <<: *default
    database: storage/tour_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/tour_queue.sqlite3
    migrations_paths: db/queue_migrate


# Store production database in the storage/ directory, which is
# mounted as a persistent volume by Once (or Docker).
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
