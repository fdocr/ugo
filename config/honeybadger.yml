---
# For more options, see https://docs.honeybadger.io/lib/ruby/gem-reference/configuration
# Reads from AppConfig (admin panel) with ENV fallback. Gracefully disables
# itself when neither is configured.

api_key: '<%= (AppConfig.honeybadger_key rescue nil) || ENV["HONEYBADGER_API_KEY"] || "NA" %>'
report_data: <%= ((AppConfig.honeybadger_key rescue nil) || ENV["HONEYBADGER_API_KEY"]).present? && Rails.env.production? %>

env: "<%= Rails.env %>"
root: "<%= Rails.root.to_s %>"

development_environments:
- test
- development
- cucumber

debug: false

insights:
  enabled: true
