---
# For more options, see https://docs.honeybadger.io/lib/ruby/gem-reference/configuration
# Configured solely via the HONEYBADGER_API_KEY environment variable.
# Gracefully disables itself when the variable is unset.

api_key: '<%= ENV["HONEYBADGER_API_KEY"].presence || "NA" %>'
report_data: <%= ENV["HONEYBADGER_API_KEY"].present? && Rails.env.production? %>

env: "<%= Rails.env %>"
root: "<%= Rails.root.to_s %>"

development_environments:
- test
- development
- cucumber

debug: false

insights:
  enabled: true

# Puma dashboard charts (backlog, pool capacity, running threads) use polled
# metrics in addition to stats.puma events. Requires plugin :honeybadger in puma.rb.
puma:
  insights:
    metrics: true

# Solid Queue runs in-process via the Puma plugin; enable cluster metrics for the
# job dashboard (queue depth, workers, etc.).
solid_queue:
  insights:
    metrics: true
