name: Release

# Manual code releases: push a v* tag (from your machine or GitHub Releases).
# GeoLite2 DB refreshes: Update GeoLite2 DB workflow creates a tag, uploads a
# trigger artifact, and this workflow's workflow_run handler builds the image.
# (GITHUB_TOKEN tag pushes do not fire push workflows, so workflow_run is used.)

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Update GeoLite2 DB"]
    types: [completed]

jobs:
  build-from-tag:
    if: github.event_name == 'push'
    uses: ./.github/workflows/docker-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  resolve-geolite-trigger:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_build: ${{ steps.download.outputs.should_build }}
      tag: ${{ steps.download.outputs.tag }}
    steps:
      - name: Download geolite release trigger
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            -n geolite-release-trigger \
            -D trigger 2>/dev/null; then
            echo "No geolite release trigger — GeoLite2 database was already up to date"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG=$(python3 -c "import json; print(json.load(open('trigger/geolite-release-trigger.json'))['tag'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "GeoLite2 update detected — will build Docker image for $TAG"

  build-from-geolite:
    needs: resolve-geolite-trigger
    if: >
      github.event_name == 'workflow_run' &&
      needs.resolve-geolite-trigger.outputs.should_build == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      tag: ${{ needs.resolve-geolite-trigger.outputs.tag }}
    secrets: inherit
