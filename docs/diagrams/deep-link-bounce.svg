<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Deep link bounce flow">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b8fd8"/>
    </marker>
  </defs>
  <rect x="10" y="60" width="150" height="80" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="85" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#111827">In-app browser</text>
  <text x="85" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6b7280">(social, etc.)</text>

  <rect x="250" y="60" width="170" height="80" rx="8" fill="#eff6ff" stroke="#5aa9e6"/>
  <text x="335" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#111827">ugo domain</text>
  <text x="335" y="115" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b8fd8">/r?r=destination</text>

  <rect x="510" y="60" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="610" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#111827">Native app</text>
  <text x="610" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6b7280">Universal / App Links</text>

  <line x1="160" y1="100" x2="248" y2="100" stroke="#3b8fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="100" x2="508" y2="100" stroke="#3b8fd8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="335" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6b7280">302 bounce + visit tracked</text>
</svg>
